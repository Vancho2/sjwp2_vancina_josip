<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <h2>Zadatak 1</h2>
    <svg width="800" height="800">
      <rect x="0" y="0" width="800" height="800"></rect>
      <rect x="20" y="20" width="760" height="760" fill="lightblue"></rect>
      <circle cx="650" cy="150" r="100" fill="yellow"></circle>
      <rect x="20" y="580" width="760" height="200" fill="blue"></rect>
      <rect x="150" y="530" width="285" height="70" fill="brown"></rect>
      <polygon points="170,510,415,510,295,330" fill="white"></polygon>
      <rect
        x="285"
        y="280"
        width="20"
        height="250"
        fill="black"
        stroke="brown"
      ></rect>
      <polygon points="230,305,280,325,280,285" fill="green"></polygon>
    </svg>

    <h2>Zadatak 2</h2>
    <svg width="800" height="800">
      <rect x="0" y="0" width="800" height="800" fill="#F2DBC3"></rect>
      <ellipse cx="400" cy="800" rx="600" ry="300" fill="#F6F4E8"></ellipse>

      <rect x="170" y="570" width="20" height="100" fill="gray"></rect>
      <polygon points="100,570,260,570,182,200" fill="#37745A"></polygon>

      <rect x="320" y="550" width="10" height="60" fill="gray"></rect>
      <polygon points="280,550,370,550,320,350" fill="#37745A"></polygon>

      <rect x="510" y="520" width="10" height="70" fill="gray"></rect>
      <polygon points="480,520,550,520,515,340" fill="#37745A"></polygon>

      <rect x="670" y="550" width="15" height="90" fill="gray"></rect>
      <polygon points="610,550,750,550,675,250" fill="#37745A"></polygon>
    </svg>

    <h2>Zadatak 3</h2>
    <svg width="800" height="800">
      <circle cx="400" cy="400" r="150" fill="#D14A5B"></circle>

      <circle
        cx="400"
        cy="200"
        r="30"
        stroke="coral"
        fill="white"
        stroke-width="5"
      ></circle>
      <rect x="360" y="220" width="80" height="40" fill="coral"></rect>
    </svg>

    <h2>Zadatak 4</h2>
    <svg width="800" height="800">
      <rect x="350" y="600" width="100" height="50" fill="coral"></rect>

      <polygon points="270,500,530,500,400,300" fill="green"></polygon>
      <polygon points="300,400,500,400,400,250" fill="lightgreen"></polygon>

    <h2>Zadatak 5</h2>
    <svg width="800" height="800">
      <circle cx="250" cy="300" r="50" fill="brown"></circle>
      <circle cx="500" cy="300" r="50" fill="brown"></circle>
      <polygon points="250,250,500,250,500,350,250,350" fill="brown"></polygon>

      <circle cx="300" cy="480" r="50" fill="brown"></circle>
      <circle cx="420" cy="480" r="50" fill="brown"></circle>
      <polygon points="252,470,280,350,375,350,350,480" fill="brown"></polygon>
      <polygon points="370,475,360,350,450,350,470,480" fill="brown"></polygon>

      <circle cx="365" cy="190" r="80" fill="brown"></circle>

      <rect
        x="340"
        y="220"
        height="10"
        width="50"
        fill="brown"
        stroke="white"
        stroke-width="3"
      ></rect>

      <circle cx="365" cy="290" r="10"></circle>
      <circle cx="365" cy="340" r="10"></circle>
    </svg>

    <h2>Zadatak 6</h2>
    <svg width="800" height="800">
      <ellipse
        cx="400"
        cy="400"
        rx="200"
        ry="200"
        fill="yellow"
        stroke="black"
        stroke-width="10"
      ></ellipse>
    </svg>
