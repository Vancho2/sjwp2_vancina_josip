<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="text" placeholder="idk" id="unos">
    <p id="izlaz">name ničeg još</p>

    <script>
        const ulaz = document.getElementById("unos");
        const izlaz = document.getElementById("izlaz");

        document.addEventListener("keydown", function(event){
           if(event.key === "Enter"){
                izlaz.textContent = "Enter";
                alert("Potvrđeno");
           }
           if(event.key === "Escape"){
                izlaz.textContent = "Esc";
                ulaz.value = null;
           }
        });
    </script>
</body>
</html>
