<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <canvas
      id="myCanvas"
      width="600"
      height="600"
      style="border: 1px solid black"
    ></canvas>
    <script>
      let c = document.getElementById("myCanvas");
      let ctx = c.getContext("2d");
      //pravokutnik
      ctx.beginPath();
      ctx.rect(200, 300, 200, 100);
      ctx.fillStyle = "blue";
      ctx.fill();
      //krov
      ctx.beginPath();
      ctx.moveTo(200, 300);
      ctx.lineTo(300, 250);
      ctx.lineTo(400, 300);
      ctx.fillStyle = "darkred";
      ctx.fill();
      //vrata
      ctx.beginPath();
      ctx.rect(220, 330, 40, 70);
      ctx.fillStyle = "lightgrey";
      ctx.fill();
      //prozor
      ctx.beginPath();
      ctx.rect(300, 330, 80, 40);
      ctx.fillStyle = "lightblue";
      ctx.fill();
      //drvo
      ctx.beginPath();
      ctx.rect(500, 300, 20, 100);
      ctx.fillStyle = "brown";
      ctx.fill();
      //krosnja
      ctx.beginPath();
      ctx.arc(510, 290, 40, 0, 2 * Math.PI);
      ctx.fillStyle = "green";
      ctx.fill();
    </script>
  </body>
</html>
